<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>His Majesty - Character & Slave Animation Studio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #120e0a;
            color: #fef08a;
            font-family: 'Cinzel', Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            color: #fbbf24;
            letter-spacing: 2px;
            text-shadow: 0 0 16px rgba(245, 158, 11, 0.6);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: #d6d3d1;
            letter-spacing: 1px;
        }

        #studio-card {
            background: #1c140d;
            border: 2px solid #b45309;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 24px rgba(217, 119, 6, 0.25);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 860px;
        }

        #viewport-wrapper {
            position: relative;
            width: 540px;
            height: 440px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #78350f;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Background Themes */
        .bg-papyrus {
            background: linear-gradient(180deg, #f7eedf 0%, #ecdcc6 100%);
        }
        .bg-dark {
            background: radial-gradient(circle at center, #241911 0%, #0d0906 100%);
        }
        .bg-sunset {
            background: linear-gradient(180deg, #fdba74 0%, #ea580c 50%, #7c2d12 100%);
        }
        .bg-checker {
            background-color: #2b221a;
            background-image: 
                linear-gradient(45deg, #1f1711 25%, transparent 25%), 
                linear-gradient(-45deg, #1f1711 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1f1711 75%), 
                linear-gradient(-45deg, transparent 75%, #1f1711 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #previewCanvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Controls Panel */
        .controls-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            width: 100%;
        }

        .btn-group {
            display: flex;
            background: #281d14;
            border: 1px solid #78350f;
            border-radius: 6px;
            overflow: hidden;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: #d6d3d1;
            padding: 8px 14px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:not(:last-child) {
            border-right: 1px solid #451a03;
        }

        .tool-btn:hover {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .tool-btn.active {
            background: #b45309;
            color: #ffffff;
            font-weight: 700;
        }

        .slider-label {
            font-size: 11px;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #281d14;
            border: 1px solid #78350f;
            border-radius: 6px;
            padding: 6px 12px;
        }

        input[type="range"] {
            accent-color: #fbbf24;
            cursor: pointer;
        }

        /* Timeline Scrubber */
        .timeline-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
            background: #150f09;
            border: 1px solid #572004;
            border-radius: 8px;
            width: 100%;
            overflow-x: auto;
        }

        .frame-thumb {
            width: 60px;
            height: 70px;
            border: 2px solid #572004;
            border-radius: 6px;
            background: #241911;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .frame-thumb:hover {
            border-color: #f59e0b;
            transform: translateY(-2px);
        }

        .frame-thumb.active {
            border-color: #fbbf24;
            background: #3b2718;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .frame-thumb img {
            max-width: 90%;
            max-height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .frame-thumb-label {
            font-size: 8px;
            color: #d6d3d1;
            margin-top: 2px;
            text-align: center;
        }

        .nav-links {
            margin-top: 18px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-link {
            color: #fbbf24;
            text-decoration: none;
            font-size: 12px;
            border-bottom: 1px dotted #fbbf24;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #ffffff;
            border-bottom-style: solid;
        }
    </style>
</head>
<body>

    <header>
        <h1>His Majesty - Animation Studio</h1>
        <p class="subtitle">Pure isolated preview of King & Slave animations with zero-ghosting verification</p>
    </header>

    <div id="studio-card">
        <!-- Canvas Viewport -->
        <div id="viewport-wrapper" class="bg-papyrus">
            <canvas id="previewCanvas" width="540" height="440"></canvas>
        </div>

        <!-- Controls Toolbar -->
        <div class="controls-toolbar">
            <!-- Playback -->
            <div class="btn-group">
                <button id="btn-play" class="tool-btn active">⏸ Pause</button>
                <button id="btn-prev" class="tool-btn">◀ Step</button>
                <button id="btn-next" class="tool-btn">Step ▶</button>
            </div>

            <!-- Avatar Model -->
            <div class="btn-group">
                <button id="btn-model-pharaoh" class="tool-btn active">👑 Pharaoh (Fig 2)</button>
                <button id="btn-model-portrait" class="tool-btn">👑 Portrait (Fig 1)</button>
                <button id="btn-model-slave" class="tool-btn">𓊽 Slave (Fig 2)</button>
                <button id="btn-model-slave-fig1" class="tool-btn">☥ Mural Slave (Fig 1)</button>
            </div>

            <!-- Background Theme -->
            <div class="btn-group">
                <button id="btn-bg-papyrus" class="tool-btn active">Papyrus</button>
                <button id="btn-bg-dark" class="tool-btn">Dark</button>
                <button id="btn-bg-checker" class="tool-btn">Checker</button>
                <button id="btn-bg-sunset" class="tool-btn">Sunset</button>
            </div>

            <!-- Guides & Shadows -->
            <div class="btn-group">
                <button id="btn-guide" class="tool-btn active">📏 Baseline</button>
                <button id="btn-shadow" class="tool-btn active">Shadow</button>
            </div>

            <!-- Speed & Zoom -->
            <div class="btn-group">
                <label class="slider-label">
                    Speed:
                    <input id="slider-speed" type="range" min="0.1" max="2.5" step="0.1" value="1.0" style="width: 70px;">
                    <span id="speed-val">1.0x</span>
                </label>
            </div>

            <div class="btn-group">
                <label class="slider-label">
                    Zoom:
                    <input id="slider-zoom" type="range" min="1.5" max="4.5" step="0.25" value="2.8" style="width: 70px;">
                    <span id="zoom-val">2.8x</span>
                </label>
            </div>
        </div>

        <!-- Dynamic Timeline Scrubber -->
        <div id="timeline" class="timeline-container"></div>

        <div class="nav-links">
            <a class="nav-link" href="index.html">← Back to Full Game</a>
            <a class="nav-link" href="king_walk_showcase.gif" target="_blank">Download King Walk GIF</a>
            <a class="nav-link" href="slave_animation_showcase.gif" target="_blank">Download Slave Submission GIF</a>
            <a class="nav-link" href="slave_postures_inspection.jpg" target="_blank">View 14-Pose Inspection</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');

        // State
        let isPlaying = true;
        let currentFrame = 0;
        let frameTimer = 0;
        let speed = 1.0;
        let zoom = 2.8;
        let avatarMode = 'pharaoh'; // 'pharaoh', 'portrait', 'slave', 'slave_fig1'
        let showBaseline = true;
        let showShadow = true;
        const baseFrameDuration = 0.25; // seconds per state

        // Assets
        const pharaohFrames = [];
        const slaveFrames = [];
        const slaveFig1Frames = [];
        let portraitImg = new Image();

        // 1. Load Pharaoh frames
        for (let i = 0; i < 7; i++) {
            const img = new Image();
            img.src = `assets/sprites/king_walk_padded_${i}.png`;
            pharaohFrames.push(img);
        }

        // 2. Load Portrait
        portraitImg.src = 'assets/sprites/king_custom_portrait.png';

        // 3. Load Fig 2 Slave postures
        const slaveFig2Defs = [
            { id: 'carry', src: 'assets/sprites/subject_carry_goods.png', label: '1. Carry' },
            { id: 'captive', src: 'assets/sprites/subject_captive.png', label: '2. Alert' },
            { id: 'kneel', src: 'assets/sprites/subject_kneel_greet.png', label: '3. Kneel' },
            { id: 'offer_food', src: 'assets/sprites/subject_offer_food.png', label: '4. Food' },
            { id: 'offer_urn', src: 'assets/sprites/subject_offer_urn.png', label: '5. Urn' },
            { id: 'offer_chest', src: 'assets/sprites/subject_offer_chest.png', label: '6. Chest' },
            { id: 'prostrate', src: 'assets/sprites/subject_prostrate.png', label: '7. Prostrate' }
        ];

        slaveFig2Defs.forEach(def => {
            const img = new Image();
            img.src = def.src;
            img.label = def.label;
            slaveFrames.push(img);
        });

        // 4. Load Fig 1 Slave postures
        const slaveFig1Defs = [
            { id: 'bundle', src: 'assets/sprites/subj1_bundle.png', label: '1. Bundle' },
            { id: 'urn', src: 'assets/sprites/subj1_urn.png', label: '2. Urn' },
            { id: 'fruit', src: 'assets/sprites/subj1_fruit.png', label: '3. Fruit' },
            { id: 'chest', src: 'assets/sprites/subj1_chest.png', label: '4. Chest' },
            { id: 'prostrate', src: 'assets/sprites/subj1_prostrate.png', label: '5. Prostrate' }
        ];

        slaveFig1Defs.forEach(def => {
            const img = new Image();
            img.src = def.src;
            img.label = def.label;
            slaveFig1Frames.push(img);
        });

        // Setup Timeline UI
        const timeline = document.getElementById('timeline');

        function rebuildTimeline() {
            timeline.innerHTML = '';
            let list = [];
            if (avatarMode === 'pharaoh') {
                list = pharaohFrames.map((img, i) => ({ img, label: `F${i+1}` }));
            } else if (avatarMode === 'portrait') {
                list = [{ img: portraitImg, label: 'Portrait' }];
            } else if (avatarMode === 'slave') {
                list = slaveFrames.map(img => ({ img, label: img.label }));
            } else if (avatarMode === 'slave_fig1') {
                list = slaveFig1Frames.map(img => ({ img, label: img.label }));
            }

            list.forEach((item, idx) => {
                const thumb = document.createElement('div');
                thumb.className = `frame-thumb ${idx === currentFrame ? 'active' : ''}`;
                thumb.id = `thumb-${idx}`;
                thumb.innerHTML = `
                    <img src="${item.img.src}" alt="${item.label}">
                    <span class="frame-thumb-label">${item.label}</span>
                `;
                thumb.addEventListener('click', () => {
                    currentFrame = idx;
                    isPlaying = false;
                    updatePlayBtn();
                    updateTimeline();
                });
                timeline.appendChild(thumb);
            });
        }

        function updateTimeline() {
            const count = getFrameCount();
            for (let i = 0; i < count; i++) {
                const el = document.getElementById(`thumb-${i}`);
                if (el) el.classList.toggle('active', i === currentFrame);
            }
        }

        function getFrameCount() {
            if (avatarMode === 'pharaoh') return pharaohFrames.length;
            if (avatarMode === 'portrait') return 1;
            if (avatarMode === 'slave') return slaveFrames.length;
            if (avatarMode === 'slave_fig1') return slaveFig1Frames.length;
            return 1;
        }

        function updatePlayBtn() {
            const btn = document.getElementById('btn-play');
            btn.innerText = isPlaying ? '⏸ Pause' : '▶ Play';
            btn.classList.toggle('active', isPlaying);
        }

        // Event Listeners
        document.getElementById('btn-play').addEventListener('click', () => {
            isPlaying = !isPlaying;
            updatePlayBtn();
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            isPlaying = false;
            const count = getFrameCount();
            currentFrame = (currentFrame - 1 + count) % count;
            updatePlayBtn();
            updateTimeline();
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            isPlaying = false;
            const count = getFrameCount();
            currentFrame = (currentFrame + 1) % count;
            updatePlayBtn();
            updateTimeline();
        });

        // Model Switchers
        const modelBtns = {
            'btn-model-pharaoh': 'pharaoh',
            'btn-model-portrait': 'portrait',
            'btn-model-slave': 'slave',
            'btn-model-slave-fig1': 'slave_fig1'
        };

        Object.entries(modelBtns).forEach(([btnId, mode]) => {
            document.getElementById(btnId).addEventListener('click', function() {
                avatarMode = mode;
                currentFrame = 0;
                Object.keys(modelBtns).forEach(id => document.getElementById(id).classList.remove('active'));
                this.classList.add('active');
                rebuildTimeline();
                updateTimeline();
            });
        });

        // Backgrounds
        const viewport = document.getElementById('viewport-wrapper');
        const bgBtns = {
            'btn-bg-papyrus': 'bg-papyrus',
            'btn-bg-dark': 'bg-dark',
            'btn-bg-checker': 'bg-checker',
            'btn-bg-sunset': 'bg-sunset'
        };

        Object.entries(bgBtns).forEach(([btnId, bgClass]) => {
            document.getElementById(btnId).addEventListener('click', function() {
                viewport.className = bgClass;
                Object.keys(bgBtns).forEach(id => document.getElementById(id).classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Guides
        document.getElementById('btn-guide').addEventListener('click', function() {
            showBaseline = !showBaseline;
            this.classList.toggle('active', showBaseline);
        });

        document.getElementById('btn-shadow').addEventListener('click', function() {
            showShadow = !showShadow;
            this.classList.toggle('active', showShadow);
        });

        // Sliders
        const speedSlider = document.getElementById('slider-speed');
        speedSlider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = `${speed.toFixed(1)}x`;
        });

        const zoomSlider = document.getElementById('slider-zoom');
        zoomSlider.addEventListener('input', (e) => {
            zoom = parseFloat(e.target.value);
            document.getElementById('zoom-val').innerText = `${zoom.toFixed(1)}x`;
        });

        rebuildTimeline();

        // 60 FPS Render Loop
        let lastTime = performance.now();

        function loop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            const duration = (avatarMode === 'pharaoh') ? 0.13 : 0.45;

            if (isPlaying && getFrameCount() > 1) {
                frameTimer += dt * speed;
                if (frameTimer >= duration) {
                    frameTimer = 0;
                    currentFrame = (currentFrame + 1) % getFrameCount();
                    updateTimeline();
                }
            }

            render();
            requestAnimationFrame(loop);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const groundY = canvas.height * 0.76;
            const centerX = canvas.width / 2;

            // Draw Alignment Guides
            if (showBaseline) {
                ctx.save();
                ctx.strokeStyle = 'rgba(180, 83, 9, 0.45)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);

                // Ground line
                ctx.beginPath();
                ctx.moveTo(30, groundY);
                ctx.lineTo(canvas.width - 30, groundY);
                ctx.stroke();

                // Vertical center guide
                ctx.beginPath();
                ctx.moveTo(centerX, 40);
                ctx.lineTo(centerX, groundY + 20);
                ctx.stroke();

                ctx.setLineDash([]);
                ctx.font = '10px Cinzel, serif';
                ctx.fillStyle = '#b45309';
                ctx.fillText('Ground Baseline (Zero Gap)', 35, groundY - 6);
                ctx.restore();
            }

            if (avatarMode === 'pharaoh') {
                const sprite = pharaohFrames[currentFrame];
                if (!sprite || !sprite.complete) return;

                const drawW = sprite.width * zoom;
                const drawH = sprite.height * zoom;
                const drawX = centerX - drawW / 2;
                const drawY = groundY - drawH;

                if (showShadow) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(35, 18, 10, 0.38)';
                    ctx.beginPath();
                    ctx.ellipse(centerX + 6 * zoom, groundY, 25 * zoom, 5.5 * zoom, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.drawImage(sprite, drawX, drawY, drawW, drawH);

            } else if (avatarMode === 'portrait') {
                if (!portraitImg.complete) return;
                const drawW = 100 * zoom * 0.85;
                const drawH = 125 * zoom * 0.85;

                const time = performance.now() * 0.006 * speed;
                const bob = isPlaying ? Math.sin(time * 2) * (5 * (zoom / 2.8)) : 0;
                const drawX = centerX - drawW / 2;
                const drawY = groundY - drawH + bob;

                if (showShadow) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(35, 18, 10, 0.38)';
                    ctx.beginPath();
                    const shadowWidth = (28 - bob * 0.5) * zoom;
                    ctx.ellipse(centerX + 8 * zoom, groundY, shadowWidth, 6 * zoom, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.drawImage(portraitImg, drawX, drawY, drawW, drawH);

            } else if (avatarMode === 'slave') {
                const sprite = slaveFrames[currentFrame];
                if (!sprite || !sprite.complete) return;

                const drawW = sprite.width * zoom * 1.1;
                const drawH = sprite.height * zoom * 1.1;
                const drawX = centerX - drawW / 2;
                const drawY = groundY - drawH;

                if (showShadow) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(35, 18, 10, 0.38)';
                    ctx.beginPath();
                    const isProstrate = (currentFrame === 6);
                    const shadowWidth = (isProstrate ? 42 : 24) * zoom;
                    ctx.ellipse(centerX, groundY, shadowWidth, 5.5 * zoom, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.drawImage(sprite, drawX, drawY, drawW, drawH);

                // Status text overlay
                ctx.save();
                ctx.font = 'bold 12px Cinzel, serif';
                ctx.fillStyle = '#b45309';
                ctx.textAlign = 'center';
                ctx.fillText(`State: ${sprite.label} | Zero Ghosting Verified`, centerX, 55);
                ctx.restore();

            } else if (avatarMode === 'slave_fig1') {
                const sprite = slaveFig1Frames[currentFrame];
                if (!sprite || !sprite.complete) return;

                const drawW = sprite.width * zoom * 0.9;
                const drawH = sprite.height * zoom * 0.9;
                const drawX = centerX - drawW / 2;
                const drawY = groundY - drawH;

                if (showShadow) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(35, 18, 10, 0.38)';
                    ctx.beginPath();
                    const isProstrate = (currentFrame === 4);
                    const shadowWidth = (isProstrate ? 44 : 26) * zoom;
                    ctx.ellipse(centerX, groundY, shadowWidth, 5.5 * zoom, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.drawImage(sprite, drawX, drawY, drawW, drawH);

                ctx.save();
                ctx.font = 'bold 12px Cinzel, serif';
                ctx.fillStyle = '#b45309';
                ctx.textAlign = 'center';
                ctx.fillText(`Mural Pose: ${sprite.label} | Zero Ghosting Verified`, centerX, 55);
                ctx.restore();
            }
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
